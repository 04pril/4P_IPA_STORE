name: Sync BitChord releases

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-bitchord-releases
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out IPA store
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync the latest published BitChord IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/sync-bitchord.py
      - name: Commit changed source metadata
        run: |
          if git diff --quiet -- source.json; then
            echo "BitChord is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json
          git commit -m "Sync latest BitChord release to IPA store"
          git push
