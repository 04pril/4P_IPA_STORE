name: LightOn
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGNING_ALLOWED: NO
    SUPPORTS_MACCATALYST: NO
    GENERATE_INFOPLIST_FILE: NO
targets:
  LightOn:
    type: application
    platform: iOS
    sources:
      - path: LightOn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: '04prillighton'
        PRODUCT_NAME: LightOn
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: '0.2.0'
        CURRENT_PROJECT_VERSION: '2'
    info:
      path: LightOn/Info.plist
      properties:
        CFBundleDisplayName: LightOn
        CFBundleURLTypes:
          - CFBundleURLName: lighton-actions
            CFBundleURLSchemes: [lighton]
        NSBluetoothAlwaysUsageDescription: LightOn uses Bluetooth advertising to send on/off commands to your light.
        LSRequiresIPhoneOS: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    dependencies:
      - target: LightOnWidget
        embed: true
        codeSign: false
  LightOnWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: LightOnWidget
      # Shared App Intents must be present in BOTH targets so the widget
      # button can reference them; the app-process conformance above handles
      # execution routing when WidgetKit invokes the intent.
      - path: LightOn/LightOnIntents.swift
      - path: LightOn/LampController.swift
      - path: LightOn/HFKJProtocol.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: '04prillighton.widget'
        PRODUCT_NAME: LightOnWidget
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        MARKETING_VERSION: '0.2.0'
        CURRENT_PROJECT_VERSION: '2'
    info:
      path: LightOnWidget/Info.plist
      properties:
        CFBundleDisplayName: LightOn Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
